server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Optional: serve the API from the same origin (then build with VITE_API_BASE_URL=/api/v1)
  # location /api/ {
  #   proxy_pass http://music-api:5000;
  #   proxy_set_header Host $host;
  #   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  #   proxy_set_header X-Forwarded-Proto $scheme;
  # }

  # Hashed build assets can be cached forever
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  # The service worker and manifest must always be revalidated so updates are picked up
  location = /sw.js { expires -1; try_files $uri =404; }
  location = /manifest.webmanifest { default_type application/manifest+json; expires -1; try_files $uri =404; }

  # SPA fallback; never cache the HTML shell
  location / {
    expires -1;
    try_files $uri /index.html;
  }
}
